[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wildfireGP*", "scripts"]

[project]
name = "wildfireGP"
dynamic = ["version"]
authors = [
  { name = "J Hughes", email = "jhughes@stfx.ca" }
]
description = "GP-evolved programs for wildfire suppression resource allocation on graphs"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "deap>=1.4",
  "networkx>=3.0",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "flake8==7.3.0",
  "flake8-black==0.3.6",
  "flake8-isort==6.1.2",
  "flake8-pyproject==1.2.3",
  "isort==6.0.1",
  "mdformat==0.7.22",
  "mdformat-gfm==0.4.1",
  "pytest==9.0.1",
]

[project.scripts]
format = "scripts.format:main"

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.flake8]
max-line-length = 120
max-complexity = 10
per-file-ignores = ["__init__.py:F401"]
