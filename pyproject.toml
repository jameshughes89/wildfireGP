[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wildfireGP*", "scripts"]

[project]
name = "wildfireGP"
version = "0.1.0"
authors = [
  { name = "J Hughes", email = "jhughes@stfx.ca" }
]
description = "GP-evolved programs for wildfire suppression resource allocation on graphs"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "black[jupyter]==26.3.1",
  "codespell==2.4.2",
  "deap==1.4.4",
  "flake8==7.3.0",
  "flake8-black==0.4.0",
  "flake8-isort==7.0.0",
  "flake8-pyproject==1.2.4",
  "isort==8.0.1",
  "matplotlib==3.10.9",
  "mdformat==1.0.0",
  "mdformat-black==0.1.1",
  "mdformat-gfm==1.0.0",
  "networkx==3.6.1",
  "numpy==2.4.4",
  "pytest==9.0.3",
  "dill==0.3.9",
  "scipy>=1.12",
]

[project.scripts]
format = "scripts.dev:run_formatters"
verify = "scripts.dev:run_verification"

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.codespell]

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.flake8]
max-line-length = 120
max-complexity = 10
per-file-ignores = ["__init__.py:F401"]
